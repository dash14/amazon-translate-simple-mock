services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: dash14/amazon-translate-simple-mock
    container_name: amazon-translate-simple-mock
    volumes:
      - ./app:/code/app
    ports:
      - "8080:8080"
    restart: always
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

  app-image:
    image: dash14/amazon-translate-simple-mock:latest@sha256:0720d6e33506d3b4ea2952a8faf9eecd9050086ad2990f86a83822bceaf841a8
    # image: ghcr.io/dash14/amazon-translate-simple-mock:latest
    container_name: amazon-translate-simple-mock-image
    ports:
      - "8080:8080"
    restart: always
