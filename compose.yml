services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: dash14/amazon-translate-simple-mock
    container_name: amazon-translate-simple-mock
    volumes:
      - ./app:/code/app
    ports:
      - "8080:8080"
    restart: always
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

  app-image:
    image: dash14/amazon-translate-simple-mock:latest@sha256:73ae037718219f768ce663ae8e8342e43321b87ae5bcf71f925d12121e52268d
    # image: ghcr.io/dash14/amazon-translate-simple-mock:latest
    container_name: amazon-translate-simple-mock-image
    ports:
      - "8080:8080"
    restart: always
